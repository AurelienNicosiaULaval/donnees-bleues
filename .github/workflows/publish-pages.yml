name: Validate Quarto site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quarto-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          install-quarto: false
          packages: |
            any::cansim
            any::curl
            any::dplyr
            any::ggplot2
            any::httr2
            any::janitor
            any::jsonlite
            any::knitr
            any::lubridate
            any::purrr
            any::readr
            any::readxl
            any::rmarkdown
            any::scales
            any::sf
            any::stringr
            any::tibble
            any::tidyr
            any::xml2
            any::yaml
            any::sessioninfo

      - name: Validate datasets and render site
        run: |
          rm -rf docs
          Rscript scripts/check_datasets.R
          Rscript scripts/render_site.R
          touch docs/.nojekyll
