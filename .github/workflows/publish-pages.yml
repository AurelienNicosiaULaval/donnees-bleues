name: Validate and publish Données bleues

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: donnees-bleues-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RENV_CONFIG_AUTO_SNAPSHOT: 'FALSE'
      RENV_CONFIG_PAK_ENABLED: 'FALSE'
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libcurl4-openssl-dev libssl-dev libxml2-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff-dev libjpeg-dev libmagick++-dev
      - name: Restore locked R packages
        uses: r-lib/actions/setup-renv@v2
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.38'
      - name: Set up Node for the WebAssembly checks
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify environment and publication rules
        run: |
          Rscript -e 'stopifnot(as.character(getRversion()) == "4.5.0"); renv::status(); for (f in list.files("tests", pattern="[.]R$", full.names=TRUE)) source(f)'
          Rscript scripts/check_published_files.R
          Rscript scripts/check_environment.R
          Rscript scripts/check_datasets.R
          Rscript datasets/caribous-riviere-aux-feuilles/verification.R
          Rscript scripts/check_public_previews.R
      - name: Test contribution validation without sending email
        run: python3 -m unittest discover -s server -p 'test_*.py'
      - name: Test the distributed activities without downloads
        run: Rscript scripts/check_classroom_kits.R
      - name: Test and package the house explorer
        run: |
          Rscript scripts/check_house_explorer.R
          Rscript -e 'setwd("applications/explorer-maisons-quebec"); source("check-server.R")'
          Rscript scripts/build_house_tools.R
      - name: Test activities that require source acquisition
        run: Rscript scripts/check_source_activities.R --acquire
      - name: Test and package the house bootstrap
        run: |
          Rscript scripts/build_bootstrap_tools.R
          Rscript -e 'setwd("applications/bootstrap-maisons-quebec"); source("check-server.R")'
      - name: Test and package the accident permutations
        run: |
          Rscript scripts/build_permutation_tools.R
          Rscript -e 'setwd("applications/permutations-accidents-quebec"); source("check-server.R")'
      - name: Test and package the ggplot builder
        run: |
          Rscript -e 'setwd("applications/ggplot-builder-donnees-bleues"); source("verifier.R")'
          Rscript scripts/build_ggplot_tools.R
      - name: Render a new site and verify the exact artifact
        run: |
          rm -rf docs
          Rscript scripts/render_site.R
          Rscript scripts/check_site.R
          touch docs/.nojekyll
      - name: Export and verify the browser Shiny application
        run: |
          Rscript scripts/export_house_app.R
          Rscript scripts/check_house_static.R
          node scripts/check_house_webr.mjs
          Rscript scripts/export_ggplot_app.R
          Rscript scripts/check_ggplot_static.R
          node scripts/check_ggplot_webr.mjs
          Rscript scripts/export_bootstrap_app.R
          Rscript scripts/check_bootstrap_static.R
          node scripts/check_bootstrap_webr.mjs
          Rscript scripts/export_permutation_app.R
          Rscript scripts/check_permutation_static.R
          node scripts/check_permutation_webr.mjs
          Rscript scripts/check_seo.R
      - name: Upload validated site for review
        uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: docs
          retention-days: 7
      - name: Upload validated Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the validated artifact
        id: deployment
        uses: actions/deploy-pages@v4
