project:
  type: website
  output-dir: docs
  resources:
    - favicon.svg
    - assets/logo-donnees-bleues.svg
    - assets/cards/*.webp
    - assets/cards/*.png
    - assets/cards/*.jpg
  render:
    - "index.qmd"
    - "catalogue.qmd"
    - "zero-waste.qmd"
    - "activites.qmd"
    - "about.qmd"
    - "contribuer.qmd"
    - "references.qmd"
    - "credits-images.qmd"
    - "donnees-ulaval.qmd"
    - "datasets/**/*.qmd"
    - "activities/**/*.qmd"
    - "!templates/**/*.qmd"

website:
  title: "Données bleues"
  description: "Catalogue pédagogique de jeux de données québécois et canadiens pour l'enseignement de la statistique, de R et de la science des données."
  site-url: "https://aureliennicosiaulaval.github.io/donnees-bleues/"
  repo-url: "https://github.com/AurelienNicosiaULaval/donnees-bleues"
  repo-actions: [source, issue]
  open-graph: true
  favicon: favicon.svg
  navbar:
    logo: assets/logo-donnees-bleues.svg
    logo-alt: "Logo Données bleues"
    background: "#325EA8"
    foreground: "#ffffff"
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Catalogue"
        href: catalogue.qmd
      - text: "Zéro déchet"
        href: zero-waste.qmd
      - text: "Activités"
        href: activites.qmd
      - text: "À propos"
        href: about.qmd
    right:
      - icon: book
        text: "Documentation"
        href: references.qmd
      - icon: github
        text: "GitHub"
        href: https://github.com/AurelienNicosiaULaval/donnees-bleues
      - text: "Contribuer"
        href: contribuer.qmd
  page-footer:
    left: "Données bleues"
    right: "Ressource pédagogique ouverte en développement"

format:
  html:
    theme: default
    css: styles.css
    embed-resources: false
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true

execute:
  warning: false
  message: false
  freeze: auto
