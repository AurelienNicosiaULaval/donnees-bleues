project:
  type: website
  output-dir: docs
  resources:
    - favicon.svg
    - assets/cards/*.jpg
  render:
    - "*.qmd"
    - "datasets/**/*.qmd"
    - "activities/**/*.qmd"
    - "!templates/**/*.qmd"

website:
  title: "Données bleues"
  site-url: "https://aureliennicosiaulaval.github.io/donnees-bleues/"
  favicon: favicon.svg
  navbar:
    background: "#003DA5"
    foreground: "#ffffff"
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Catalogue"
        href: catalogue.qmd
      - text: "Zéro déchet"
        href: zero-waste.qmd
      - text: "Activités"
        href: activites.qmd
      - text: "Contribuer"
        href: contribuer.qmd
      - text: "À propos"
        href: about.qmd
  page-footer:
    left: "Données bleues"
    right: "Ressource pédagogique ouverte en développement"

format:
  html:
    theme: default
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true

execute:
  warning: false
  message: false
  freeze: auto
