project:
  type: website
  output-dir: docs
  resources:
    - CITATION.cff
    - LICENSE
    - LICENCE-CONTENUS.md
    - favicon.svg
    - assets/logo-donnees-bleues.svg
    - assets/logo-donnees-bleues-horizontal.svg
    - assets/illustrations/*.svg
    - assets/previews/*.csv
    - assets/previews/*.json
    - assets/charts/*.svg
    - assets/classroom/*.zip
    - assets/classroom/*.json
    - assets/cards/*.webp
    - assets/cards/*.png
    - assets/cards/*.jpg
    - templates/retour-classe-template.md
  render:
    - "index.qmd"
    - "catalogue.qmd"
    - "ressources.qmd"
    - "lectures.qmd"
    - "applications.qmd"
    - "guide.qmd"
    - "resources/*.qmd"
    - "zero-waste.qmd"
    - "activites.qmd"
    - "about.qmd"
    - "contribuer.qmd"
    - "retours-classe.qmd"
    - "sequences.qmd"
    - "references.qmd"
    - "credits-images.qmd"
    - "donnees-ulaval.qmd"
    - "datasets/**/*.qmd"
    - "activities/**/*.qmd"
    - "!templates/**/*.qmd"

website:
  title: "Données bleues"
  description: "Catalogue pédagogique de jeux de données québécois et canadiens pour l'enseignement de la statistique, de R et de la science des données."
  site-url: "https://donneesbleues.ca/"
  repo-url: "https://github.com/AurelienNicosiaULaval/donnees-bleues"
  repo-actions: [source, issue]
  search: false
  open-graph: true
  favicon: favicon.svg
  navbar:
    collapse-below: xl
    logo: assets/logo-donnees-bleues.svg
    logo-alt: "Logo Données bleues"
    background: "#ffffff"
    foreground: "#172033"
    left:
      - text: "Accueil"
        href: index.qmd
      - text: "Données"
        href: catalogue.qmd
      - text: "Planifier"
        href: activites.qmd
      - text: "Lectures et documents"
        href: lectures.qmd
      - text: "Applications"
        href: applications.qmd
      - text: "Guide du site"
        href: guide.qmd
      - text: "À propos"
        href: about.qmd
    right:
      - icon: search
        text: "Rechercher"
        href: ressources.qmd
      - text: "Contribuer"
        href: contribuer.qmd
  page-footer:
    left: "Données bleues · version 0.2.0 · septembre 2026"
    right: "Des données publiques à enseigner, avec contexte."

lang: fr

format:
  html:
    theme: default
    css:
      - styles.css
      - assets/css/navigation.css
      - assets/css/previews.css
      - assets/css/activities.css
      - assets/css/resources.css
      - assets/css/layout.css
    include-before-body: assets/skip-link.html
    include-after-body: assets/resource-search.html
    embed-resources: true
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true

execute:
  warning: false
  message: false
  freeze: auto
