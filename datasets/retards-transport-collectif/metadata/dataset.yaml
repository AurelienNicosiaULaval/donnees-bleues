title: "Flux temps réel STM et ponctualité des bus"
description: "Fiche de protocole pour utiliser le flux GTFS-realtime de la STM en enseignement, sans inventer de table historique de retards."
source: "Horaires et positionnement des bus en temps réel (GTFS-realtime)"
source_url: "https://www.donneesquebec.ca/recherche/dataset/vmtl-stm-bus-temps-reel-gtfs-realtime"
source_api_url: "https://www.donneesquebec.ca/recherche/api/3/action/package_show?id=vmtl-stm-bus-temps-reel-gtfs-realtime"
source_developer_url: "https://www.stm.info/fr/a-propos/developpeurs"
license: "Attribution (CC-BY 4.0) selon les métadonnées CKAN vérifiées le 2026-06-21"
update_frequency: "Temps réel ou quasi temps réel; une analyse historique exige un archivage local planifié"
geographic_coverage: "Réseau d'autobus de la STM"
temporal_coverage: "Temps réel; historique disponible seulement si les instantanés sont archivés localement"
variables:
- name: "collection_time"
  type: "date-heure"
  description: "Horodatage ajouté par le protocole d'archivage local."
  example: "2026-06-21 09:00:00"
- name: "route_id"
  type: "caractère"
  description: "Identifiant de ligne ou parcours extrait du flux ou d'une jointure GTFS."
  example: "80"
- name: "trip_id"
  type: "caractère"
  description: "Identifiant de trajet, utile pour relier le temps réel aux horaires planifiés."
  example: "Je ne sais pas."
- name: "delay_seconds"
  type: "numérique"
  description: "Retard brut en secondes si le message GTFS-realtime contient un délai."
  example: "180"
- name: "retard_minutes"
  type: "numérique"
  description: "Variable dérivée de delay_seconds, pas une colonne brute garantie."
  example: "3"
educational_topics:
  - "flux temps réel"
  - "métadonnées"
  - "séries temporelles"
  - "données manquantes"
  - "échantillonnage temporel"
  - "qualité de service"
difficulty: "Intermédiaire"
suggested_visualizations:
  - "séries temporelles"
  - "boxplots par ligne"
  - "cartes de positions de véhicules"
question_analyse: "Comment construire un protocole reproductible pour mesurer la ponctualité à partir d'un flux temps réel?"
status: "source officielle vérifiée; fiche de protocole, pas de table historique prête à distribuer"
notes:
  - "Le paquet CKAN vérifié expose une ressource GTFS qui pointe vers le portail développeur STM."
  - "Aucune table historique de retards n'est directement téléchargeable dans le paquet CKAN."
  - "Les retards doivent être construits à partir d'instantanés archivés et documentés."
