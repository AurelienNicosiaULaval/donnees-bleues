title: "Retards et ponctualité du transport collectif (STT-1100)"
description: "Jeu de données de la collection Québec pour la science des données (STT-1100). Quelles lignes présentent les retards les plus importants?"
source: "Horaires et positionnement des bus en temps réel (GTFS-realtime), lorsque les champs de délai sont disponibles"
source_url: "https://www.donneesquebec.ca/recherche/dataset/vmtl-stm-bus-temps-reel-gtfs-realtime"
license: "Attribution (CC-BY 4.0) selon les métadonnées CKAN STM vérifiées le 2026-06-19"
update_frequency: "Temps réel ou quasi temps réel selon le service; l'archivage doit être construit par l'enseignant ou l'équipe de cours"
geographic_coverage: "Réseau STM et autres réseaux québécois si des flux comparables sont validés"
temporal_coverage: "Observations temps réel; historique seulement si un archivage est mis en place"
variables:
- name: "date"
  type: "date"
  description: "Date de collecte ou de passage."
  example: "2026-02-03"
- name: "ligne"
  type: "caractère"
  description: "Ligne, route ou parcours."
  example: "80"
- name: "retard_minutes"
  type: "numérique"
  description: "Retard en minutes, dérivé du flux ou d'une comparaison horaire."
  example: "4.5"
- name: "direction"
  type: "caractère"
  description: "Direction du trajet."
  example: "Nord"
- name: "secteur"
  type: "caractère"
  description: "Secteur, arrondissement ou zone analytique."
  example: "Plateau-Mont-Royal"
educational_topics:
  - "statistiques descriptives"
  - "distributions"
  - "valeurs extrêmes"
  - "séries temporelles"
  - "qualité de service"
difficulty: "Intermédiaire"
suggested_visualizations:
  - "boxplots"
  - "histogrammes"
  - "séries temporelles"
lab_stt1100: "Quelles lignes présentent les retards les plus importants?"
status: "source temps réel vérifiée; jeu historique prêt à enseigner à construire"
notes:
  - "Ne pas présenter retard_minutes comme une colonne brute garantie. C'est une variable dérivée possible selon le flux et le protocole de collecte."
  - "Vérifier la structure exacte de la ressource officielle avant de distribuer un fichier préparé aux étudiants."
