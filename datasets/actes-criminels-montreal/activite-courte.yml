id: actes-criminels-ethique-court
title: Lire prudemment des données de sécurité publique
question: Que peut-on décrire sans transformer ces données ouvertes en statistiques
  officielles?
dataset_id: actes-criminels-montreal
dataset_title: Actes criminels enregistrés à Montréal
activity_url: datasets/actes-criminels-montreal/activite-courte.qmd
duration: 30-45 minutes
level: Intermédiaire
activity_type:
- Laboratoire
- Discussion guidée
concepts:
- Données sensibles
- Unité statistique
- Catégories
- Statistique descriptive
- Éthique
context: Sécurité publique
hook: Des données sensibles ne deviennent pas des statistiques officielles par simple
  visualisation
materials:
- énoncé
- code
- table préparée
advanced_math_stats: no
teacher_notes: Ne pas demander de classement de quartiers dangereux et interdire les
  cartes de points bruts.
status: source officielle vérifiée
pedagogical_status: pret_a_enseigner
teacher_preparation: 'Préparation requise : exécuter `Rscript datasets/actes-criminels-montreal/preparation.R`
  depuis la racine, puis vérifier que `data/processed/actes-criminels-montreal/actes_criminels_montreal.csv`
  existe.'
expected_output: Un tableau ou graphique descriptif accompagné de trois phrases d'interprétation
  prudente.
requires_prepared_data: yes
requires_live_download: yes
recommended_use: Discussion guidée
result_visible_in_page: yes

learning_objectives:
  - "Identifier l'unité statistique d'un fichier de sécurité publique."
  - "Résumer des catégories avec une table de fréquences."
  - "Reconnaître une année partielle."
  - "Écrire une limite méthodologique et une limite éthique."
  - "Éviter une visualisation stigmatisante."

prerequisites:
  - "Vérifier le fichier ou le script de préparation annoncé avant la séance; adapter la mise en route au niveau indiqué."

success_criteria:
  - "La production attendue est remise : Un tableau ou graphique descriptif accompagné de trois phrases d'interprétation prudente."
  - "Les résultats sont interprétés sans dépasser les limites de la source."

adaptations:
  - "Fournir une table préparée ou réduire le nombre de variables pour une première utilisation."
  - "Ajouter une comparaison, une justification méthodologique ou une discussion des limites pour approfondir."
