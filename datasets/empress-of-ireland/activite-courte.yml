id: empress-of-ireland-exploration
title: 'Empress of Ireland : compter les personnes derrière les tableaux'
question: Comment comparer la survie selon la classe et les catégories historiques sans confondre lignes, personnes
  et proportions ?
dataset_id: empress-of-ireland
dataset_title: 'Empress of Ireland : classe, âge et survie'
activity_url: datasets/empress-of-ireland/activite-courte.qmd
script_file: datasets/empress-of-ireland/activite-courte.R
classroom_archive: assets/classroom/empress-of-ireland.zip
