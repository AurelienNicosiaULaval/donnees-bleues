title: "Réseaux de transport collectif GTFS au Québec (STT-1100)"
description: "Jeu de données intégré au catalogue Données bleues pour STT-1100. Quelle est la densité des arrêts de transport collectif selon le secteur?"
source: "GTFS ouverts des sociétés de transport, notamment RTC et STM"
source_url: "https://www.donneesquebec.ca/recherche/dataset/rtc-gtfs-arrets-et-les-parcours"
license: "Attribution (CC-BY 4.0) pour les fiches CKAN RTC et STM vérifiées; confirmer chaque feed utilisé"
update_frequency: "Variable selon la société de transport; les horaires planifiés sont mis à jour selon les périodes de service"
geographic_coverage: "Territoires desservis par les sociétés de transport québécoises"
temporal_coverage: "Horaires planifiés valides selon le calendrier GTFS de chaque feed"
variables:
- name: "route_id"
  type: "caractère"
  description: "Identifiant de ligne ou parcours dans routes.txt."
  example: "800"
- name: "stop_id"
  type: "caractère"
  description: "Identifiant d'arrêt dans stops.txt."
  example: "12345"
- name: "stop_name"
  type: "caractère"
  description: "Nom public de l'arrêt."
  example: "Université Laval"
- name: "latitude"
  type: "numérique"
  description: "Latitude de l'arrêt."
  example: "46.78"
- name: "longitude"
  type: "numérique"
  description: "Longitude de l'arrêt."
  example: "-71.28"
- name: "trip_id"
  type: "caractère"
  description: "Identifiant de voyage dans trips.txt."
  example: "A2025_001"
educational_topics:
  - "données relationnelles"
  - "jointures multiples"
  - "visualisation spatiale"
  - "réseaux"
  - "normalisation de données"
difficulty: "Intermédiaire"
suggested_visualizations:
  - "cartes interactives"
  - "graphes de réseau"
  - "cartes de densité d'arrêts"
lab_stt1100: "Quelle est la densité des arrêts de transport collectif selon le secteur?"
status: "sources RTC et STM vérifiées; autres sociétés à confirmer au cas par cas"
notes:
  - "La fiche source principale pointe vers le GTFS du RTC; ajouter d'autres feeds vérifiés dans les exemples selon le territoire du laboratoire."
  - "Vérifier la structure exacte de la ressource officielle avant de distribuer un fichier préparé aux étudiants."
