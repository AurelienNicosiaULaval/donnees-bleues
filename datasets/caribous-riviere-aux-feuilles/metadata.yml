essential_limits:
  - "Extraits sélectionnés autour des plans d'eau, et non migrations complètes. Les effectifs ne représentent pas l'ensemble des caribous du Québec."
  - "Datum GPS et fuseau horaire non documentés. La carte suppose WGS84; les durées sont des différences d'horloge civile."
  - "Intervalles irréguliers; traits interpolés entre mesures. Distances et vitesses dérivées ne décrivent pas le trajet exact."
  - "Six positions présentent une discordance entre ID et IDYR, conservée et signalée. Les observations répétées par individu ne sont pas indépendantes."
table_overview:
  Positions: 1 911 positions de 52 individus, avec 95 identifiants individu-année
  Pas: 1 592 transitions à l'intérieur des 319 segments, sans liaison entre segments
  Segments: 179 traversées sur glace, 11 à la nage et 129 contournements
  Tables complémentaires: 401 lignes glace-eau et 68 lignes NAO/AO; pas de jointure automatique
