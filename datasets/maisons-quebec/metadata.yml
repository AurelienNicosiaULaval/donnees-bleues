summary: '600 maisons de la ville de Québec, avec superficies, année de construction, type de bâtiment et valeur au rôle. Deux activités abordent l’exploration et la régression avec validation par voisinage.'
observation_period: 'Rôle entré en vigueur en 2025; référence au marché le 1er juillet 2023; extraction 2026'
essential_limits:
  - Les valeurs inscrites au rôle sont des évaluations foncières, sans prix de vente observés.
  - Le tirage porte sur les unités admissibles d’un instantané de Québec. Il ne représente pas toutes les habitations ni les maisons de la province.
  - L’aire d’étages est brute et peut inclure un garage intégré; elle ne mesure pas une superficie habitable nette.
  - La valeur totale est la somme des valeurs du terrain et du bâtiment. Ces composantes constituent une fuite de cible si elles servent à prédire le total.
  - Une séparation des voisinages réduit leur chevauchement entre ensembles; elle ne prouve pas l’indépendance spatiale ni une performance sur des ventes futures.
