id: maisons-quebec-bootstrap
title: Estimer une moyenne et une médiane par bootstrap
question: Comment quantifier l’incertitude d’une statistique à partir des 600 maisons observées ?
dataset_id: maisons-quebec
dataset_title: 'Maisons du Québec : valeurs foncières à Québec'
