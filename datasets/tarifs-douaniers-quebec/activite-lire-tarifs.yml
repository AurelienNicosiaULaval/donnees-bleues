hook: Un tarif de 50 % ne signifie pas que tous les prix augmenteront de 50 %.
materials: [Trousse ZIP et projet RStudio, Script R complet, Onze tables figées et dictionnaire]
advanced_math_stats: false
teacher_notes: Conserver les codes comme texte et distinguer annonce, entrée en vigueur et observation. Aucun effet causal n'est estimé.
pedagogical_status: pret_a_enseigner
teacher_preparation: Extraire la trousse, installer les bibliothèques avant la séance et exécuter le script hors ligne depuis la racine du projet.
expected_output: Quatre graphiques, un comptage de codes et un rapprochement vérifié du décret avec la liste récapitulative.
learning_objectives:
  - Identifier le grain de chaque table et préserver ses clés.
  - Lire une trajectoire en escalier et construire un indice par série.
  - Distinguer une description temporelle d'une estimation causale.
prerequisites:
  - Savoir importer un CSV et exécuter un script R.
  - Comprendre pourcentage, indice et jointure.
success_criteria:
  - Les codes à huit chiffres gardent leurs zéros initiaux.
  - Les 335 lignes du décret retrouvent les mêmes taux dans le panneau de 648 lignes.
  - Les quatre graphiques comportent unité, période, source et limite.
  - La conclusion indique que juillet précède les nouvelles mesures de septembre.
adaptations:
  - Interpréter les graphiques fournis avant de modifier le script.
  - Choisir une catégorie SCPAN et un partenaire en vérifiant les recouvrements.
