essential_limits:
- Les taux sont des surtaxes avant exemptions et remises. La base ne calcule pas les
  droits effectivement payés.
- Une absence dans un panneau historique ne vaut pas taux nul. Les différents panneaux
  ne doivent pas être additionnés.
- Les prix et le commerce s'arrêtent en juillet 2026, avant les mesures de septembre;
  aucun effet de celles-ci n'est estimé.
- Les séries de prix ne renseignent pas l'origine douanière. Le commerce est agrégé
  en catégories SCPAN, sans concordance SH imputée.
- Les importations sont révisables; le lieu de dédouanement ne garantit pas le lieu
  de consommation finale.
table_overview:
  Contre-tarifs: 2774 observations dans trois panneaux; 648 codes dans le panneau
    du 8 septembre
  Décret: 335 codes des annexes 1 à 3, rapprochés avec leurs taux
  Prix: 110 produits et 115 mois au Québec; indicateurs de qualité conservés
  Commerce: 86710 lignes; 13 catégories, 29 partenaires, importations et exportations
    nationales
  Documentation: Sources, captures, couverture, contrôles, actualité et chronologie
