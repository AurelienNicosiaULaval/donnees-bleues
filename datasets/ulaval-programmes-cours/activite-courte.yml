id: ulaval-validation-import-court
title: Laboratoire - Valider un import institutionnel privé
question: Comment vérifier qu'un import institutionnel privé conserve les valeurs,
  les clés et la provenance sans publier les lignes?
dataset_id: ulaval-programmes-cours
dataset_title: Programmes et cours institutionnels ULaval
activity_url: datasets/ulaval-programmes-cours/activite-courte.qmd
duration: 30-45 minutes
level: Intermédiaire
activity_type:
- Exercice
- Validation de données
concepts:
- Importation contrôlée
- Provenance
- Validation
- Droits de réutilisation
context: Éducation supérieure
hook: Une validation réussie ne donne pas automatiquement un droit de publication.
materials:
- fiche vérifiée
- script de préparation
- résumés publics
advanced_math_stats: no
teacher_notes: Ne pas publier les lignes de données. L'activité porte sur les contrôles
  et les limites de diffusion.
status: source privée locale validée
pedagogical_status: pret_a_enseigner
teacher_preparation: Vérifier les droits de diffusion avant la séance; utiliser seulement
  les résumés publics et ne pas publier les lignes de données.
expected_output: Un tableau ou graphique descriptif accompagné de trois phrases d'interprétation
  prudente.
requires_prepared_data: yes
requires_live_download: no
recommended_use: Audit de source
result_visible_in_page: yes

learning_objectives:
  - "Lire un résumé de validation sans accéder aux lignes privées."
  - "Identifier les fichiers attendus et les lignes observées."
  - "Vérifier la présence des clés et des champs de provenance."
  - "Expliquer pourquoi les PDF et CSV sources ne sont pas redistribués."
  - "Distinguer validation locale et autorisation de publication."

prerequisites:
  - "Vérifier le fichier ou le script de préparation annoncé avant la séance; adapter la mise en route au niveau indiqué."

success_criteria:
  - "La production attendue est remise : Un tableau ou graphique descriptif accompagné de trois phrases d'interprétation prudente."
  - "Les résultats sont interprétés sans dépasser les limites de la source."

adaptations:
  - "Fournir une table préparée ou réduire le nombre de variables pour une première utilisation."
  - "Ajouter une comparaison, une justification méthodologique ou une discussion des limites pour approfondir."
