title: "Qualité de l'air au Québec (STT-1100)"
description: "Jeu de données intégré au catalogue Données bleues pour STT-1100. Les concentrations de PM2.5 ont-elles augmenté durant certains épisodes particuliers?"
source: "Réseau de surveillance de la qualité de l'air du Québec (RSQAQ)"
source_url: "https://www.donneesquebec.ca/recherche/dataset/rsqaq-donnees-horaires-continues"
license: "Attribution (CC-BY 4.0) selon les métadonnées CKAN vérifiées le 2026-06-19"
update_frequency: "Annuelle par ressource publiée; métadonnées CKAN modifiées le 2026-06-17"
geographic_coverage: "Québec"
temporal_coverage: "Données horaires continues disponibles par année, de 1986 à 2025 selon les ressources CKAN consultées"
variables:
- name: "date_heure"
  type: "datetime"
  description: "Date et heure de la mesure ou de la période horaire."
  example: "2025-01-15 14:00"
- name: "station"
  type: "caractère"
  description: "Identifiant ou nom de la station de mesure."
  example: "Québec - Vieux-Limoilou"
- name: "latitude"
  type: "numérique"
  description: "Latitude de la station lorsque jointe aux métadonnées de stations."
  example: "46.83"
- name: "longitude"
  type: "numérique"
  description: "Longitude de la station lorsque jointe aux métadonnées de stations."
  example: "-71.22"
- name: "pm25"
  type: "numérique"
  description: "Concentration horaire de particules fines PM2.5, si disponible."
  example: "8.4"
- name: "ozone"
  type: "numérique"
  description: "Concentration horaire d'ozone, si disponible."
  example: "22.1"
- name: "no2"
  type: "numérique"
  description: "Concentration horaire de dioxyde d'azote, si disponible."
  example: "12.0"
- name: "so2"
  type: "numérique"
  description: "Concentration horaire de dioxyde de soufre, si disponible."
  example: "1.2"
- name: "co"
  type: "numérique"
  description: "Concentration horaire de monoxyde de carbone, si disponible."
  example: "0.3"
educational_topics:
  - "séries temporelles"
  - "nettoyage de données"
  - "visualisation"
  - "détection d'anomalies"
  - "données environnementales"
difficulty: "Introduction à intermédiaire"
suggested_visualizations:
  - "séries temporelles"
  - "cartes interactives"
  - "heatmaps temporelles"
lab_stt1100: "Les concentrations de PM2.5 ont-elles augmenté durant certains épisodes particuliers?"
status: "source vérifiée; préparation pédagogique STT-1100 à finaliser"
notes:
  - "Les variables de contaminants doivent être harmonisées après inspection de la ressource annuelle retenue. Les coordonnées peuvent provenir du jeu RSQAQ des stations."
  - "Vérifier la structure exacte de la ressource officielle avant de distribuer un fichier préparé aux étudiants."
