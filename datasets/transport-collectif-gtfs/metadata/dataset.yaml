title: "Horaires, arrêts et parcours GTFS du RTC"
description: "Flux GTFS statique du Réseau de transport de la Capitale, préparé pour enseigner les données relationnelles, spatiales et temporelles en transport collectif."
source: "Données Québec / Réseau de transport de la Capitale"
source_url: "https://www.donneesquebec.ca/recherche/dataset/rtc-gtfs-arrets-et-les-parcours"
source_api_url: "https://www.donneesquebec.ca/recherche/api/3/action/package_show?id=rtc-gtfs-arrets-et-les-parcours"
source_zip_url: "https://cdn.rtcquebec.ca/Site_Internet/DonneesOuvertes/googletransit.zip"
source_secondary_url: "https://www.rtcquebec.ca/donnees-ouvertes"
license: "Attribution (CC-BY 4.0) selon les métadonnées CKAN; conditions RTC à respecter pour la provenance et la date de mise à jour"
update_frequency: "Le RTC publie un ZIP GTFS vivant; le feed_info du ZIP téléchargé couvre les services du 2026-06-20 au 2026-08-21"
geographic_coverage: "Territoire desservi par le Réseau de transport de la Capitale, région de Québec"
temporal_coverage: "Services planifiés du 2026-06-20 au 2026-08-21 dans le ZIP téléchargé le 2026-06-21"
variables:
- name: "stop_id"
  type: "caractère"
  description: "Identifiant d'arrêt dans stops.txt."
  example: "1-1005"
- name: "stop_name"
  type: "caractère"
  description: "Nom public de l'arrêt."
  example: "Champlain/1005"
- name: "latitude"
  type: "numérique"
  description: "Latitude de l'arrêt."
  example: "46.812"
- name: "longitude"
  type: "numérique"
  description: "Longitude de l'arrêt."
  example: "-71.205"
- name: "route_id"
  type: "caractère"
  description: "Identifiant de parcours dans routes.txt."
  example: "1-800"
- name: "route_short_name"
  type: "caractère"
  description: "Numéro public du parcours."
  example: "800"
- name: "trip_id"
  type: "caractère"
  description: "Identifiant de trajet planifié dans trips.txt."
  example: "109804847_20260620daily"
- name: "service_id"
  type: "caractère"
  description: "Identifiant du calendrier de service."
  example: "20260620daily"
- name: "service_date"
  type: "date"
  description: "Date de service dans calendar_dates.txt."
  example: "2026-06-20"
educational_topics:
  - "données relationnelles"
  - "clés de jointure"
  - "visualisation spatiale"
  - "formats normalisés"
  - "valeurs codées"
  - "communication prudente"
difficulty: "Intermédiaire"
suggested_visualizations:
  - "carte des arrêts"
  - "barres du nombre de trajets par parcours"
  - "schéma relationnel GTFS"
question_analyse: "Comment décrire l'offre planifiée du RTC sans la confondre avec l'achalandage ou les retards?"
status: "source officielle vérifiée; ZIP GTFS du RTC préparé localement"
notes:
  - "Le flux GTFS statique décrit l'offre planifiée, pas les positions en temps réel."
  - "Les codes d'accessibilité 0 indiquent une information non disponible dans le codage GTFS, pas une absence d'accessibilité."
