title: "Établissements scolaires du Québec"
description: "Ressource pédagogique basée sur le CSV officiel Écoles publiques. Une ligne représente un lien école-immeuble, ce qui permet d'enseigner le comptage, la cartographie et les limites d'interprétation."
source: "Localisation des établissements d'enseignement du réseau scolaire au Québec"
source_url: "https://www.donneesquebec.ca/recherche/dataset/localisation-des-etablissements-d-enseignement-du-reseau-scolaire-au-quebec"
source_resource_url: "https://www.donneesquebec.ca/recherche/dataset/localisation-des-etablissements-d-enseignement-du-reseau-scolaire-au-quebec/resource/c6640a54-bc4b-43ec-864e-6c325dce61bc"
source_data_url: "https://www.donneesquebec.ca/recherche/dataset/2d3b5cf8-b347-49c7-ad3b-bd6a9c15e443/resource/c6640a54-bc4b-43ec-864e-6c325dce61bc/download/pps_public_ecole.csv"
license: "Attribution (CC-BY 4.0) selon les métadonnées CKAN vérifiées le 2026-06-20"
update_frequency: "Hebdomadaire selon l'API CKAN; paquet modifié le 2026-06-16"
geographic_coverage: "Québec"
temporal_coverage: "État courant selon la ressource téléchargée le 2026-06-20"
unit: "Lien école publique-immeuble scolaire"
variables:
  - name: "CD_ORGNS"
    type: "numérique"
    description: "Code unique de l'organisme scolaire."
    example: "689007"
  - name: "CD_IMM"
    type: "numérique"
    description: "Code unique de l'immeuble scolaire."
    example: "689024"
  - name: "ORDRE_ENS"
    type: "caractère"
    description: "Ordre ou combinaison d'ordres d'enseignement."
    example: "Préscolaire - Primaire"
  - name: "NOM_REG_ADM"
    type: "caractère"
    description: "Région administrative."
    example: "Capitale-Nationale"
  - name: "COORD_X_LL84_IMM"
    type: "numérique"
    description: "Longitude WGS84 de l'immeuble."
    example: "-71.21"
  - name: "COORD_Y_LL84_IMM"
    type: "numérique"
    description: "Latitude WGS84 de l'immeuble."
    example: "46.81"
educational_topics:
  - "géolocalisation"
  - "cartographie"
  - "jointures"
  - "unité statistique"
  - "double comptage"
  - "données publiques"
difficulty: "Introduction à intermédiaire"
suggested_visualizations:
  - "carte de points"
  - "graphique de comptes par région"
  - "comparaison liens, organismes et immeubles"
question_analyse: "Comment cartographier les écoles publiques du Québec sans confondre une école, un immeuble et un lien école-immeuble?"
status: "source officielle vérifiée; ressource CSV Écoles publiques préparée localement"
notes:
  - "Une ligne représente un lien école-immeuble, pas nécessairement une école unique."
  - "Les comptes par région ne mesurent pas directement l'accès scolaire sans population, distance ou capacité."
