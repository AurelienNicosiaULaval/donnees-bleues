title: "Établissements scolaires du Québec"
description: "Jeu de données intégré au catalogue Données bleues pour l'enseignement de la science des données. Où sont localisées les écoles du Québec et quelles régions sont les plus densément desservies?"
source: "Localisation des établissements d'enseignement du réseau scolaire au Québec"
source_url: "https://www.donneesquebec.ca/recherche/dataset/localisation-des-etablissements-d-enseignement-du-reseau-scolaire-au-quebec"
license: "Attribution (CC-BY 4.0) selon les métadonnées CKAN vérifiées le 2026-06-19"
update_frequency: "Mise à jour fréquente; métadonnées CKAN modifiées le 2026-06-16"
geographic_coverage: "Québec"
temporal_coverage: "État courant des établissements selon la ressource téléchargée"
variables:
- name: "nom_ecole"
  type: "caractère"
  description: "Nom de l'école ou de l'établissement."
  example: "École primaire Exemple"
- name: "type"
  type: "caractère"
  description: "Type d'organisme ou d'établissement."
  example: "École publique"
- name: "centre_services"
  type: "caractère"
  description: "Centre de services scolaire ou organisme responsable."
  example: "CSS de la Capitale"
- name: "region"
  type: "caractère"
  description: "Région administrative ou territoire associé."
  example: "Capitale-Nationale"
- name: "latitude"
  type: "numérique"
  description: "Latitude en WGS84 ou issue de la couche géographique."
  example: "46.81"
- name: "longitude"
  type: "numérique"
  description: "Longitude en WGS84 ou issue de la couche géographique."
  example: "-71.21"
educational_topics:
  - "géolocalisation"
  - "cartographie"
  - "jointures"
  - "densité spatiale"
  - "données publiques"
difficulty: "Introduction à intermédiaire"
suggested_visualizations:
  - "cartes Leaflet"
  - "clustering spatial"
  - "cartes de points"
question_analyse: "Où sont localisées les écoles du Québec et quelles régions sont les plus densément desservies?"
status: "source vérifiée; couche précise à choisir selon le laboratoire"
notes:
  - "Le jeu officiel contient plusieurs couches; la couche Écoles publiques est souvent la plus simple pour l'enseignement de la science des données."
  - "Vérifier la structure exacte de la ressource officielle avant de distribuer un fichier préparé aux étudiants."
