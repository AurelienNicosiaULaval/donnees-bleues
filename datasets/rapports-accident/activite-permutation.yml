id: rapports-accident-permutation
title: Comparer deux proportions par permutation
question: La proportion d’accidents avec victimes diffère-t-elle entre semaine et fin de semaine ?
dataset_id: rapports-accident
dataset_title: Rapports d’accident
activity_url: datasets/rapports-accident/activite-permutation.qmd
