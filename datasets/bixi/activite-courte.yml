learning_objectives:
- Vérifier le ratio vélos disponibles/capacité pour les stations de capacité positive.
- Calculer la proportion sous 25 %, repérer les stations sans vélo et lire l’histogramme.
- Formuler une limite qui découle de la source et de l’unité observée.
