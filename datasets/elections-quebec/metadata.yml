essential_limits:
  - "Le CSV principal conserve une capture de la nuit et une capture finale. Sélectionner la dernière par élection et par source avant de compter les candidatures ou d’additionner les votes."
  - "Le statut final reprend l’indicateur explicite isResultatsFinaux du producteur. Un dépouillement à 100 % ne suffit pas, à lui seul, à établir ce statut."
  - "Le champ elected_source est absent dans la source examinée et reste NA. Le rang descriptif ne remplace pas une déclaration nominative d’élection; les sièges par parti sont dans une table distincte."
  - "Les identifiants de candidature et de parti sont contextualisés par scrutin. Les codes de circonscription dépendent de la carte électorale; une jointure par nom seul n’est pas fiable."
  - "Les tables adaptées de finances, de contributions et de démographie sont réservées à une reconstruction locale selon les droits des sources. Les contributions nominatives ne sont pas diffusées."
reference_note: "Les dimensions et contrôles portent sur la version fixe du 6 octobre 2026 proposée au téléchargement. La dernière capture a été collectée à 9 h 24, heure du Québec. Les captures sont des consultations successives, pas des votes ou des candidatures supplémentaires."
