essential_limits:
- Dix programmes sélectionnés, sans échantillonnage représentatif. Sherbrooke couvre
  Acti-Famille et Drummondville le CCSP uniquement.
- Les prix à la semaine, pour la saison, par enfant et par famille restent distincts;
  les champs manquants ne valent pas zéro.
- Le scénario donne six sous-totaux documentés, un calcul conditionnel et trois cas
  non calculables. Les taxes et certains frais restent inconnus.
- 'Sources rétrospectives de 2026 : les places disponibles, l''accompagnement accordé
  et les dépenses réellement payées ne sont pas observés.'
table_overview:
  Programmes et conditions: 10 programmes; 59 faits documentés et 44 champs non documentés
  Tarifs: 108 lignes, 19 colonnes; catégories de résidence, rang d'enfant et taille
    de famille distincts
  Provenance: 166 preuves reliées à 14 pages sources, avec dates de collecte et empreintes
  Calcul et qualité: 10 lignes de scénario, 16 composantes de calcul et 8 points de
    qualité
