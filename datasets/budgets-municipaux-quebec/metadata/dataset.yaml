title: "Profil financier des municipalités locales du Québec"
description: "Jeu de données officiel du MAMH décrivant le profil financier 2024-2025 des municipalités locales, avec indicateurs de richesse foncière, ratios, indices, classes de population et rattachements territoriaux."
source: "Profil financier des municipalités locales"
source_url: "https://www.donneesquebec.ca/recherche/dataset/profil-financier-des-municipalites-locales"
source_api_url: "https://www.donneesquebec.ca/recherche/api/3/action/package_show?id=profil-financier-des-municipalites-locales"
source_csv_url: "https://mamh.gouv.qc.ca/fichiersdonneesouvertes/PF-2024-2025.csv"
source_dictionary_url: "https://mamh.gouv.qc.ca/fichiersdonneesouvertes/PF-2024-2025-DescriptionPoste.csv"
license: "Attribution (CC-BY 4.0) selon les métadonnées CKAN vérifiées le 2026-06-21"
update_frequency: "Annuelle; paquet CKAN et ressources CSV 2024-2025 modifiés le 2026-06-19"
geographic_coverage: "Québec, municipalités locales et agglomérations publiées dans la ressource 2024-2025"
temporal_coverage: "Profil financier 2024-2025, données de 2025"
unit: "Municipalité locale ou agglomération publiée"
prepared_files:
  - "data/processed/budgets-municipaux-quebec/profil_financier_municipalites_2025.csv"
  - "data/processed/budgets-municipaux-quebec/profil_financier_municipalites_long_2025.csv"
  - "data/processed/budgets-municipaux-quebec/dictionnaire_postes_profil_financier_2025.csv"
variables:
- name: "code_geographique"
  type: "caractère"
  description: "Code géographique à 5 caractères de la municipalité ou de l'agglomération."
  example: "23027"
- name: "municipalite"
  type: "caractère"
  description: "Nom de l'organisme municipal publié."
  example: "Québec"
- name: "region_administrative"
  type: "caractère"
  description: "Région administrative."
  example: "Capitale-Nationale"
- name: "population"
  type: "numérique"
  description: "Population décrétée dans le fichier officiel."
  example: "594443"
- name: "classe_population"
  type: "caractère"
  description: "Classe de population publiée."
  example: "100 000 et plus"
- name: "FIALX01959"
  type: "numérique"
  description: "RFU selon le dictionnaire officiel des postes."
  example: "31790348758"
- name: "FIALX02005"
  type: "numérique"
  description: "Part de l'évaluation imposable uniformisée résidentielle dans l'évaluation uniformisée des immeubles imposables."
  example: "82.1"
- name: "FIALX02097"
  type: "numérique"
  description: "Indice de RFU par unité d'évaluation imposable et compensable."
  example: "100"
educational_topics:
  - "importation CSV"
  - "dictionnaire de variables"
  - "pivot long"
  - "classes de population"
  - "ratios"
  - "indices"
  - "statistiques descriptives"
difficulty: "Introduction à intermédiaire"
suggested_visualizations:
  - "barres par classe de population"
  - "boîtes à moustaches par région"
  - "cartes ou tableaux régionaux"
question_analyse: "Comment les indicateurs de richesse foncière varient-ils selon la taille et la région des municipalités?"
status: "source officielle vérifiée; CSV municipal 2024-2025 et dictionnaire des postes préparés localement"
notes:
  - "La ressource préparée provient du sommaire du rôle d'évaluation foncière 2025."
  - "Elle ne contient pas un budget municipal détaillé par postes de dépenses."
  - "Les comparaisons doivent rester descriptives sans conclure à des causes."
