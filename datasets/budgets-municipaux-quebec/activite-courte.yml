id: profil-financier-classes-court
title: Profils fonciers par classe de population
question: Comment la part résidentielle de l'évaluation imposable uniformisée varie-t-elle
  selon la classe de population?
dataset_id: budgets-municipaux-quebec
dataset_title: Profil financier des municipalités locales du Québec
activity_url: datasets/budgets-municipaux-quebec/activite-courte.qmd
duration: 45-60 minutes
level: Introduction à intermédiaire
activity_type:
- Laboratoire
- Exploration de données
concepts:
- Dictionnaire de variables
- Classes de population
- Médiane
- Visualisation
- Interprétation prudente
context: Finances et fiscalité municipales
hook: Les petites et grandes municipalités ne se comparent pas sans tenir compte des
  classes de population
materials:
- fiche
- code
- table préparée
- dictionnaire des postes
advanced_math_stats: no
teacher_notes: Faire vérifier le sens de FIALX02005 dans le dictionnaire avant tout
  graphique.
status: source officielle vérifiée
pedagogical_status: pret_a_enseigner
teacher_preparation: 'Préparation requise : exécuter `Rscript datasets/budgets-municipaux-quebec/preparation.R`
  depuis la racine, puis vérifier que `data/processed/budgets-municipaux-quebec/profil_financier_municipalites_2025.csv`
  existe.'
expected_output: Un tableau ou graphique descriptif accompagné de trois phrases d'interprétation
  prudente.
requires_prepared_data: yes
requires_live_download: yes
recommended_use: Laboratoire guidé
result_visible_in_page: yes

learning_objectives:
  - "Importer une table préparée issue d'une source officielle."
  - "Identifier l'unité statistique."
  - "Utiliser un dictionnaire de variables."
  - "Comparer des groupes avec des statistiques descriptives."
  - "Produire une visualisation claire et interprétable."
  - "Écrire une conclusion prudente."
  - "Pourquoi utilise-t-on la médiane plutôt que la moyenne?"
  - "Pourquoi faut-il garder les codes géographiques comme du texte?"
  - "Pourquoi ne peut-on pas conclure que la taille d'une municipalité cause un profil foncier donné?"
  - "Pourquoi ce fichier ne mesure-t-il pas directement les dépenses municipales?"

prerequisites:
  - "Vérifier le fichier ou le script de préparation annoncé avant la séance; adapter la mise en route au niveau indiqué."

success_criteria:
  - "La production attendue est remise : Un tableau ou graphique descriptif accompagné de trois phrases d'interprétation prudente."
  - "Les résultats sont interprétés sans dépasser les limites de la source."

adaptations:
  - "Fournir une table préparée ou réduire le nombre de variables pour une première utilisation."
  - "Ajouter une comparaison, une justification méthodologique ou une discussion des limites pour approfondir."
