essential_limits:
  - "La couverture des récepteurs ADS-B et l'attribution géographique à CYUL varient. Les nombres ne mesurent pas le trafic officiel de l'aéroport."
  - "Les heures indiquent un début ou une fin de trajectoire détectée, sans horaire prévu ni heure de porte certifiée. Retards et annulations ne sont pas calculables."
  - "Trois jours du calendrier n'ont aucun événement retenu. Cela ne prouve pas l'absence de vols réels; le premier trimestre 2024 comporte davantage d'attributions ambiguës."
  - "Les vues des départs et arrivées peuvent compter deux fois une trajectoire qui part de YUL et y revient."
  - "Cette fiche publique ne distribue pas les colonnes météo ECCC; la licence ODbL des trajectoires reste applicable."
