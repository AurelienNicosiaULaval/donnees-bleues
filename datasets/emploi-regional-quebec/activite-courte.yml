- Savoir ouvrir un projet RStudio et exécuter un script R.
- Reconnaître une variable, un décompte et une proportion.
success_criteria:
- L’unité, la période ou la portée documentaire et les variables utilisées sont nommées.
- Comparer les séries du Québec, de Montréal et de la Capitale-Nationale dans leur unité.
- Lire les indicateurs de qualité avant de commenter les écarts.
- La conclusion répond à la question et explique au moins une limite précise.
adaptations:
- Débuter avec le script exécuté par la personne enseignante, puis faire interpréter une seule sortie.
- Pour approfondir, modifier une sélection ou un regroupement et justifier ce que cela change.
