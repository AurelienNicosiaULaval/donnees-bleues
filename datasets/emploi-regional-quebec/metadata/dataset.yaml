title: "Emploi régional au Québec"
description: "Ressource pédagogique basée sur le fichier complet du tableau 916 de l'Institut de la statistique du Québec. Une ligne représente une combinaison indicateur, territoire et mois."
source: "Caractéristiques du marché du travail, données mensuelles désaisonnalisées, régions administratives et ensemble du Québec"
source_url: "https://statistique.quebec.ca/fr/document/population-active-emploi-et-chomage-regions-administratives-rmr-et-quebec"
source_resource_url: "https://statistique.quebec.ca/fr/produit/tableau/caracteristiques-du-marche-du-travail-donnees-mensuelles-desaisonnalisees-regions-administratives-et-ensemble-du-quebec"
source_data_url: "https://statistique.quebec.ca/docs-ken/multimedia/Fichier_complet_916.xlsx"
license: "Reproduction de l'information du site de l'Institut de la statistique du Québec interdite sauf permission écrite."
update_frequency: "Mensuelle; tableau officiel mis à jour le 5 juin 2026"
geographic_coverage: "Régions administratives et ensemble du Québec"
temporal_coverage: "Janvier 2011 à mai 2026 dans le fichier vérifié le 2026-06-20"
unit: "Combinaison indicateur, territoire et mois"
variables:
  - name: "indicateur"
    type: "caractère"
    description: "Indicateur du marché du travail."
    example: "Taux de chômage"
  - name: "date"
    type: "date"
    description: "Premier jour du mois de référence."
    example: "2026-05-01"
  - name: "territoire"
    type: "caractère"
    description: "Québec ou région administrative."
    example: "Capitale-Nationale"
  - name: "unite"
    type: "caractère"
    description: "Unité de mesure de l'indicateur."
    example: "%"
  - name: "valeur_brute"
    type: "caractère"
    description: "Valeur telle que lue dans le XLSX officiel, avec code de qualité si présent."
    example: "3,2*"
  - name: "indicateur_qualite"
    type: "caractère"
    description: "Code de qualité extrait de la valeur."
    example: "*"
  - name: "valeur"
    type: "numérique"
    description: "Valeur numérique préparée pour l'analyse."
    example: "5.7"
educational_topics:
  - "séries temporelles"
  - "comparaison de groupes"
  - "données d'enquête"
  - "qualité des estimations"
  - "analyse exploratoire"
  - "statistiques descriptives"
  - "indicateurs socioéconomiques"
difficulty: "Introduction à intermédiaire"
suggested_visualizations:
  - "lignes temporelles"
  - "small multiples"
  - "heatmap territoire x mois"
question_analyse: "Comment comparer l'évolution du marché du travail entre régions sans surinterpréter des estimations issues d'une enquête?"
status: "source officielle vérifiée; fichier XLSX complet du tableau 916 préparé localement"
notes:
  - "Les estimations régionales mensuelles de l'EPA sont diffusées sous forme de moyennes mobiles sur trois mois."
  - "Les codes `F` et `*` doivent rester visibles dans les analyses pédagogiques."
